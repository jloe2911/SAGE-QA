review_required:
  - path: original_paper_exact_source_revision_and_environment
    classification: THESIS_STATUS_REVIEW_REQUIRED
    missing_evidence: dbdbb507 is the strongest candidate but ignored artifacts hosted-reader lineage and environment are not commit-bound.
  - path: outputs/development_diagnostics/final_old_vs_cross_encoder_analysis/comparison.json
    classification: KEEP_REPRODUCIBILITY
    missing_evidence: None; retained despite development naming because it is a direct READ_INPUT of the canonical hard-pair-v2 exporter.

explicit_non_keep_findings:
  paper_era_pizza: BACKUP_AND_REMOVE
  failed_or_incomplete_baseline_attempts: BACKUP_AND_REMOVE
  rejected_diagnostics_and_symbolic_alternatives: BACKUP_AND_REMOVE
  static_hard_listwise_and_a0_a3_families: BACKUP_AND_REMOVE
  bytecode_local_environment_and_empty_scratch: DELETE_RECREATABLE
